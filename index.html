<!doctype html><html lang="en"><link rel="icon" type="image/svg+xml" href="favicon.svg"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merged Audio Tools</title><style>:root {
    --bg: #121214;
    --surface: #1e1e24;
    --text: #f4f4f6;
    --accent: #7c4dff;
    --accent-alt: #4db8ff;
}
body {
    background-color: var(--bg);
    color: var(--text);
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 2rem;
    box-sizing: border-box;
}
.wrapper {
    display: flex;
    flex-direction: column;
    gap: 2rem;
    width: 100%;
    max-width: 900px;
}
.card {
    background-color: var(--surface);
    padding: 2rem;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.grid-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2rem;
}
@media (max-width: 768px) {
    .grid-layout {
        grid-template-columns: 1fr;
    }
}
h1, h2 {
    margin-top: 0;
    margin-bottom: 1.5rem;
    color: var(--text);
}
h1 { font-size: 1.6rem; text-align: center; }
h2 { font-size: 1.3rem; border-bottom: 1px solid #3f3f4a; padding-bottom: 0.5rem; }
label {
    display: block;
    margin-bottom: 0.5rem;
    font-size: 0.9rem;
    color: #aaa;
}
select {
    width: 100%;
    padding: 0.8rem;
    margin-bottom: 1.5rem;
    background-color: #2a2a32;
    color: var(--text);
    border: 1px solid #3f3f4a;
    border-radius: 6px;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
}
select:focus {
    border-color: var(--accent);
}
.row { display: flex; gap: 0.5rem; }
.result-panel {
    background-color: #2a2a32;
    border-left: 4px solid var(--accent);
    border-radius: 6px;
    padding: 1.5rem;
    transition: opacity 0.3s ease;
}
.result-panel.alt-accent {
    border-left-color: var(--accent-alt);
}
.target-key {
    font-size: 1.3rem;
    font-weight: bold;
    color: var(--accent);
    margin-bottom: 0.5rem;
}
.step-list {
    list-style: none;
    padding-left: 0;
    margin: 0;
    counter-reset: step-counter;
}
.step-list li {
    position: relative;
    padding-left: 2.5rem;
    margin-bottom: 1rem;
    font-size: 1.05rem;
}
.step-list li::before {
    counter-increment: step-counter;
    content: counter(step-counter) ".";
    position: absolute;
    left: 0;
    top: 0;
    font-weight: bold;
    color: var(--accent-alt);
}
.highlight {
    color: var(--accent-alt);
    font-weight: bold;
}
.fade {
    opacity: 0.5;
